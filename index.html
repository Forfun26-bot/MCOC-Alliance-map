<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Of Gladiators War Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout idea: art banner with the alliance name, global buff card, BG switcher, then roster beside a tall SVG war map; node details open as a sheet. */
  :root {
    --bg: #0a0e16;
    --panel: #121927;
    --panel-2: #1a2438;
    --line: #27324a;
    --text: #e9eef8;
    --muted: #8e9bb5;
    --gold: #f2b134;
    --crimson: #e5444f;
    --font-display: "Oxanium", "Barlow", system-ui, "Segoe UI", sans-serif;
    --font-body: "Barlow", system-ui, "Segoe UI", Tahoma, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
  }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 16px 16px 48px; }

  /* Hero */
  .hero { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #0d1320; }
.lang { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; gap: 2px; background: rgba(10,14,22,.78); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(4px); }
  .lang button { border: 0; background: transparent; color: #c9d3e8; font: 700 13px/1 var(--font-display, inherit); padding: 7px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .04em; }
  .lang button[aria-pressed="true"] { background: var(--gold); color: #1a1405; }
  .player.has50 .chip.c50 { background: var(--gold); border-color: var(--gold); color: #1a1405; }
  .hero img { display: block; width: 100%; height: clamp(210px, 33vw, 330px); object-fit: cover; object-position: 50% 36%; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,22,0) 20%, rgba(10,14,22,.62) 62%, rgba(10,14,22,.96) 100%); pointer-events: none; }
  .hero .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 22px 18px; z-index: 1; }
  .hero h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 52px); line-height: 1.05; letter-spacing: .5px; text-transform: uppercase; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .hero h1 span { color: var(--gold); }
  .hero p { margin: 6px 0 0; color: #c9d3e8; font-size: 16px; max-width: 64ch; text-wrap: balance; text-shadow: 0 1px 10px rgba(0,0,0,.7); }

  .steps { display: flex; gap: 10px; flex-wrap: wrap; list-style: none; padding: 0; margin: 16px 0 0; }
  .steps li { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px; font-size: 14px; }
  .steps b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #1a1405; font-size: 13px; }
  .demo { margin-top: 12px; background: rgba(229,68,79,.12); border: 1px dashed var(--crimson); color: #ffb3b9; border-radius: 10px; padding: 8px 14px; font-size: 14px; }

  /* Global buff */
  .globals { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .global { margin-top: 0; background: linear-gradient(135deg, #17203a, #121927 60%); border: 1px solid #3a4770; border-radius: 14px; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
  .gmark { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: #10151f; display: grid; place-items: center; font: 800 24px var(--font-display); border: 3px solid var(--gold); }
  .global h2 { margin: 0; font-family: var(--font-display); font-size: 17px; line-height: 1.2; }
  .global h2 small { color: var(--gold); font-size: 13px; margin-inline-start: 8px; font-weight: 700; }
  .global .intro { margin: 4px 0 0; color: #c9d3e8; max-width: 70ch; font-size: 14px; line-height: 1.4; }
  .gbody { display: grid; gap: 8px; margin-top: 8px; }
  .scale { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
  .scale .step { background: #0e1522; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-size: 13px; }
  .scale .step b { color: var(--gold); font-variant-numeric: tabular-nums; }
  .scale .more { color: var(--muted); }
  .gstats { display: flex; flex-wrap: wrap; gap: 8px; }
  .gstat { background: #0e1522; border: 1px solid var(--line); border-radius: 10px; padding: 3px 10px; display: flex; align-items: baseline; gap: 6px; }
  .gstat b { font-family: var(--font-display); font-size: 17px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .gstat span { color: var(--muted); font-size: 12.5px; }
  .gbadge { width: 40px; height: 40px; display: grid; place-items: center; }
  .gbadge img, .gbadge svg { width: 40px; height: 40px; display: block; }
  .global .tag { color: var(--gold); font-weight: 700; }
  .global .who { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .gstat.wide { flex-direction: column; gap: 2px; }
  .gstat.wide b { font-size: 18px; }
  @media (max-width: 760px) { .globals { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .global { grid-template-columns: 1fr; } }

  /* BG bar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 22px 0 14px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; padding: 8px 22px; border-radius: 9px; font-size: 16px; font-weight: 700; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #1a1405; }
  .stats { color: var(--muted); font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* Main grid */
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  .roster { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .roster h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 18px; }
  .roster .hint { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .players { display: grid; gap: 8px; }
  @media (max-width: 820px) { .players { grid-template-columns: repeat(2, 1fr); } .chips { gap: 3px; } .chip { min-width: 22px; padding: 0 4px; } }
  .player { text-align: start; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; cursor: pointer; display: grid; gap: 6px; transition: border-color .15s, background .15s; }
  .player:hover { border-color: #3a4a6b; }
  .player[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,177,52,.10); }
  .player .nm { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
  .player .nm small { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { min-width: 26px; text-align: center; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; background: #0e1522; border: 1px solid var(--line); color: #c7d1e6; }
  .player[aria-pressed="true"] .chip { border-color: rgba(242,177,52,.6); color: var(--gold); }

  /* Map */
  .mapcard { background: #070b1d; border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  .tw { animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: 1; } }
  .drift { transform-box: fill-box; transform-origin: center; animation: drift 20s ease-in-out infinite; }
  @keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); } }
  svg.map { border-radius: 12px; display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .edge { fill: none; stroke: #3b4764; stroke-width: 2; stroke-linejoin: round; }
  .edge.mesh { stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; }
  .edge.cross { stroke: #a8434a; stroke-dasharray: 7 5; stroke-width: 2; }
  .dot { fill: #f2c230; }
  .junction { fill: #f2c230; }
  .jtext { font: 700 12px var(--font-body); fill: #1a1405; text-anchor: middle; dominant-baseline: central; }
  .start-label { font: 600 12px var(--font-body); fill: var(--muted); text-anchor: middle; letter-spacing: .5px; }
  .edges { transition: opacity .25s; }

  .node { cursor: pointer; }
  .node .inner { transform-box: fill-box; transform-origin: center; transition: transform .15s, opacity .25s, filter .25s; }
  .node:hover .inner { transform: scale(1.12); }
  .node rect { stroke: rgba(255,255,255,.28); stroke-width: 1.2; }
  .node text.num { font: 700 13px var(--font-body); text-anchor: middle; dominant-baseline: central; pointer-events: none; font-variant-numeric: tabular-nums; }
  .node .pip { fill: var(--gold); stroke: #0a0e16; stroke-width: 1.5; }
  .node:focus-visible rect { stroke: #fff; stroke-width: 2.5; }

  .map.focus .node:not(.on) .inner { opacity: .18; }
  .map.focus .edges { opacity: .12; }
  .map.focus .node.on rect { stroke: var(--gold); stroke-width: 3; }
  .map.focus .node.on .inner { filter: drop-shadow(0 0 7px rgba(242,177,52,.95)); }
  .route { fill: none; stroke: var(--gold); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 8; opacity: 0; transition: opacity .25s; filter: drop-shadow(0 0 4px rgba(242,177,52,.8)); }
  .map.focus .route { opacity: .9; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }

  .paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 4px 4px; max-width: 560px; margin: 0 auto; }
  @media (max-width: 420px) { .paths { grid-template-columns: repeat(2, 1fr); } }
  .pathbtn { display: flex; align-items: flex-start; gap: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 600; cursor: pointer; text-align: start; }
  .pathbtn i { width: 14px; height: 14px; margin-top: 3px; border-radius: 4px; flex: none; border: 1px solid rgba(255,255,255,.3); }
  .pathbtn small { display: block; color: var(--muted); font-weight: 500; font-size: 11px; line-height: 1.3; }
  .pathbtn:hover { border-color: #3a4a6b; }
  .pathbtn[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,177,52,.10); }
  .legend { display: flex; gap: 6px 18px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; padding: 10px 6px 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: inline-block; }

  /* Sheet */
  .backdrop { position: fixed; inset: 0; background: rgba(4,7,12,.66); display: flex; align-items: flex-end; justify-content: center; z-index: 10; backdrop-filter: blur(2px); }
  .sheet { width: 100%; max-width: 620px; max-height: 86%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; animation: rise .22s ease-out; }
  @media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-bottom: 1px solid var(--line); border-radius: 20px; max-height: 88%; } }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-head { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); z-index: 1; }
  .badge { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; border: 1.5px solid rgba(255,255,255,.3); flex: none; }
  .sheet-head h2 { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.2; }
  .sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .sheet-head .grow { flex: 1; min-width: 0; }
  .close { border: 1px solid var(--line); background: var(--panel-2); width: 38px; height: 38px; border-radius: 10px; font-size: 22px; line-height: 1; cursor: pointer; }
  .close:hover { border-color: var(--gold); }
  .sheet-body { padding: 16px 18px 22px; display: grid; gap: 18px; }
  .sec h3 { margin: 0 0 8px; font-family: var(--font-display); font-size: 14px; color: var(--gold); letter-spacing: 1px; text-transform: uppercase; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .names { margin: 0; font-weight: 700; font-size: 17px; line-height: 1.7; }
  .names .sep { color: var(--muted); font-weight: 400; padding: 0 .2em; }
  .note { margin: 6px 0 0; color: var(--muted); font-size: 14px; white-space: pre-line; }
  .note strong, p.desc strong { color: #fff; }
  .note u, p.desc u { text-underline-offset: 3px; text-decoration-thickness: 2px; }
  p.desc { margin: 0; white-space: pre-line; }
  .draft { display: inline-block; margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #ffd98a; background: rgba(242,177,52,.14); border: 1px solid rgba(242,177,52,.5); border-radius: 999px; padding: 0 10px; }
  .empty { color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; }

  @media (prefers-reduced-motion: reduce) {
    .map.focus .route { animation: none; }
    .drift, .tw { animation: none; }
    .sheet { animation: none; }
    .node .inner, .edges, .route { transition: none; }
  }
</style>
</head>

/* ============================================================

const UI = { en: {"tagline": "War plan: pick your BG and your name, follow your route, and check the attackers for every node.", "players": "Players", "statPlayers": "Players: ", "statNodes": "Nodes explained: ", "node": "Node ", "boss": "Node 50 (Boss)", "unassigned": "Unassigned", "nodesWord": "nodes", "path": "Path ", "subs": "Subs · Section ", "bossIsland": "Boss Island", "desc": "Description", "defenders": "Expected Defenders", "attackers": "Best Attackers", "draft": "Draft, being checked", "empty": "The explanation, defenders and attackers for this node are not added yet.", "gains": " → gains ", "more": "and so on", "step1": "Pick your BG", "step2": "Tap your name to light up your route", "step3": "Tap any node for the full plan", "hint": "Tap a player to see their nodes. Tap again to reset the map.", "legend1": "Node has an explanation", "legend2": "Read the map from bottom to top"}, es: {"tagline": "Plan de guerra: elige tu BG y tu nombre, sigue tu ruta y revisa los atacantes de cada nodo.", "step1": "Elige tu BG", "step2": "Toca tu nombre para iluminar tu ruta", "step3": "Toca cualquier nodo para ver el plan completo", "players": "Jugadores", "hint": "Toca un jugador para ver sus nodos. Tócalo otra vez para reiniciar el mapa.", "legend1": "El nodo tiene explicación", "legend2": "Lee el mapa de abajo hacia arriba", "statPlayers": "Jugadores: ", "statNodes": "Nodos explicados: ", "node": "Nodo ", "boss": "Nodo 50 (Jefe)", "unassigned": "Sin asignar", "nodesWord": "nodos", "path": "Camino ", "subs": "Subs · Sección ", "bossIsland": "Isla del Jefe", "desc": "Descripción", "defenders": "Defensores esperados", "attackers": "Mejores atacantes", "draft": "Borrador, en revisión", "empty": "Todavía no se agregó la explicación, los defensores y los atacantes de este nodo.", "gains": " → gana ", "more": "y así sucesivamente"} };
const ES = {"nodes": {"1": {"desc": "Cada 10 segundos recibes un buff de Placebo. Solo no hace nada, pero puede ayudar a algunos defensores, sobre todo a los Mystics. Cada vez que te quedas cerca del defensor durante 2.2 segundos, el defensor gana un buff de Regeneration que lo cura. Lleva un campeón que bloquee o revierta la curación (Heal Block o Heal Reversal), pero revisa que el defensor no sea inmune a Heal Block ni a la curación revertida.", "attn": "Mejores opciones: cualquier campeón que se encargue de la Regeneration, o que ponga muchos debuffs al defensor."}, "2": {"desc": "Un nodo fácil con un pequeño truco. Cada vez que repites la misma acción dos veces, te ponen un buff de Placebo. Cuando el defensor usa un Ataque Especial aplica Neutralize Debuff, que evita que te pongan el Placebo. Y si alguno de esos Placebo no se puede poner, el defensor gana Prowess, que aumenta su daño. La mayoría de los defensores aquí son Mystics, que ganan poder más rápido.", "defn": "Cualquier defensor Mystic.", "attn": "Los campeones Science son los mejores, pero cualquier campeón sirve porque el nodo no es difícil. Aléjate por completo de los campeones Cosmic."}, "3": {"desc": "Recibes un Bleed enorme con cada golpe del defensor si el defensor tiene Armor.\n\nImportante: con cada Armor que tiene el defensor, recibes Glancing del 15%. Un defensor como Red Skull va sumando Armor con el tiempo, así que puedes llegar a tener entre 100% y 150% de Glancing. Por eso tienes que llevar un campeón que rompa Armor.\n\nY no cualquier campeón inmune a Bleed sirve aquí. Pueden funcionar, pero tienes que jugar perfecto, y vas a ser lento porque es muy difícil hacer daño.", "defn": "Cualquier defensor con Armor.", "attn": "Los que rompen Armor son los mejores y la elección más importante. Importante: Knull no funciona en este nodo."}, "4": {"desc": "Un nodo muy fácil y sin trucos. Si te ponen 3 debuffs, tus controles se invierten (Reverse Controls). Eso es todo.", "defn": "Cualquier defensor que te ponga muchos debuffs.", "attn": "Busca inmunidad a Reverse Controls, o a los debuffs que aplica el defensor."}, "5": {"desc": "El defensor tiene una protección que reduce un poco tu daño, y es inmune a Stun cuando hace un Dash In. Es simple: derriba al defensor para quitar la protección. Puedes hacerlo cuando el defensor termina un Ataque Pesado, o con un Ataque Especial que lo derribe. Algunos defensores aquí tienen Auto Block, como Medusa e Iron Man Infinity War, o simplemente son inmunes a Stun.", "defn": "Defensores con Auto Block, o cualquier defensor inmune a Stun.", "attn": "Elige cualquier campeón que sea buen counter del defensor. El nodo no es difícil, y los campeones de mucho daño funcionan bien."}, "6": {"desc": "Cada 15 golpes sufres Falter durante un tercio de segundo, lo que causa un Miss. Los defensores aquí serán sobre todo Mutants, porque el nodo les da Prowess cuando fallas.", "attn": "Vigila el contador de 15 golpes."}, "7": {"desc": "Cuando el defensor hace Purify de un debuff, recibes un debuff de Reflection durante 6 segundos. Hace que recibas parte del daño que le haces al defensor.", "defn": "Cualquier campeón que haga Purify.", "attn": "Usa campeones de mucho daño que no dependan de debuffs. Los campeones que hacen Purify también sirven."}, "8": {"desc": "Si golpeas al defensor con ataques que le quitan más del 2.5% de su salud, gana Fury. Cuando junta 6 Fury gana un buff de Glancing. Los defensores aquí serán sobre todo Cosmic o Mutants.", "attn": "Los campeones de Damage over Time son los mejores porque sus golpes normalmente no son fuertes. Los Mystics también son geniales, ya que quitan el Fury o cualquier otro buff."}, "9": {"desc": "Hazard Shift. Solo necesitas un campeón inmune a Rupture o Bleed, o uno que haga Purify."}, "10": {"desc": "Cuando le pones un debuff al defensor, el defensor lo quita y gana un buff de Regeneration. No uses campeones que reviertan la curación, como Nefaria: el nodo bloquea esas habilidades y el defensor se cura todavía más si lo intentas.", "attn": "Los Mystics y los campeones con Heal Block son los mejores atacantes aquí."}, "11": {"desc": "Cada 16 segundos quedas con Root durante 4 segundos. No es muy peligroso. Si no varías tus ataques, se te acaban las cargas que están debajo de tu barra de salud y el defensor gana Amplify.", "attn": "El nodo no es difícil, así que cualquier campeón sirve."}, "12": {"desc": "Un poco más difícil. Lo molesto: si no varías tus ataques, se te acaban las cargas debajo de tu barra de salud, así que no ganas poder y no puedes usar Ataques Especiales. El defensor además usa mucho Auto Block.", "defn": "O cualquier defensor tanque con mucha salud.", "attn": "Los campeones con mucho daño o que dependen de Ataques Pesados funcionan bien. Los campeones que frenan el Auto Block son los mejores."}, "13": {"desc": "Un nodo fácil sin nada especial. Solo intenta llegar a 12 golpes en tu combo para evitar el Glancing."}, "14": {"desc": "Exactamente igual que el Nodo 5, con una diferencia: el defensor es Unstoppable cuando hace un Ataque Pesado.", "defn": "Igual que el Nodo 5: defensores con Auto Block, o cualquier defensor inmune a Stun.", "attn": "Usa los mismos atacantes del Nodo 5, o cualquiera que le gane al defensor."}, "15": {"desc": "Un nodo fácil. Si le pones cualquier debuff al defensor, recibes un debuff de Exhaustion. No hay nada más: lleva un buen counter para el defensor.", "attn": "No uses campeones que hagan Purify, si no el defensor recibe una protección que reduce tu daño."}, "16": {"desc": "Un nodo simple. Cuando el defensor usa un Ataque Especial, te pone un debuff de Tranquilize que reduce la habilidad de tu campeón. No es importante."}, "17": {"desc": "Un poco complicado pero no difícil. Cada vez que el defensor gana un buff, también gana Energize, que lo hace ganar poder más rápido. El defensor es inmune a Stun, y también inmune a Armor Break y Nullify. Puedes quitar las inmunidades a Armor Break y Nullify durante 20 segundos derribando al defensor (la inmunidad a Stun se queda).", "defn": "Cualquier defensor puede estar aquí.", "attn": "Lleva cualquier counter del defensor. Los Mystics son geniales. Viv Vision funciona bien porque se vuelve intangible, así que no necesitas hacer Stun."}, "18": {"desc": "Igual que el Nodo 9 (Hazard Shift), pero esta vez el defensor gana poder más rápido hasta llegar a dos barras de poder, y los debuffs son Shock y Poison. Usa un campeón inmune a los dos, o a uno de ellos."}, "19": {"desc": "Un nodo de regeneración. Cada vez que el defensor se regenera acumula una carga oculta, y con 10 cargas gana Unblockable durante 5 segundos. Heal Block detiene la acumulación, así que es tu mejor amigo aquí. Recibe 50% menos daño de Energy y cada golpe de Energy en realidad lo cura, así que deja en casa a tus atacantes de Energy. Quemarlo, electrocutarlo o congelarlo (Incinerate, Shock, Coldsnap) también le da media barra de poder cada 10 segundos, así que evita esos debuffs también.\n\nLa regeneración del defensor no se puede revertir aquí, solo bloquear. Los campeones con Heal Reversal no van a funcionar.", "attn": "Evita a los atacantes de Energy y a los campeones con Heal Reversal."}, "20": {"desc": "Si haces dash hacia atrás dos veces seguidas, el defensor gana un buff de Regeneration.\n\nCada vez que llenas una barra de poder tienes 10 segundos para usar un Especial, o pierdes el 20% de tu poder máximo.", "defn": "Muchos defensores pueden obligarte a hacer dash hacia atrás, sobre todo cuando usan un Especial.", "attn": "Los campeones de mucho daño también funcionan bien."}, "21": {"desc": "Cada 20 segundos te golpean con un Stun. Lo puedes evitar usando un Especial cuando termina el temporizador.\n\nPor último: el defensor gana +25% de Ataque por cada buff que tiene.", "defn": "Cualquier defensor con muchos buffs."}, "22": {"desc": "En resumen: cuando tienes 3 o más debuffs encima, el daño del defensor sube, incluso si estás bloqueando.", "defn": "Cualquier defensor que te ponga muchos debuffs.", "attn": "Los campeones que hacen Purify son los mejores aquí. Purify le da al defensor un Fury (+100% de Ataque durante 10 segundos), pero no es un problema grande."}, "23": {"desc": "El defensor tiene Protection que reduce tu daño un 60%. Haz Intercept para quitarle la Protection y ganar +40% de Ataque durante 12 segundos. Cuando se acaba ese Fury la Protection vuelve y a todos los debuffs del defensor se les hace Purify, así que quítale la vida rápido mientras tienes el Fury.\n\nAdemás, cada 8 segundos recibes Falter (100% de Miss durante 3 segundos) a menos que hayas conectado un golpe mientras tanto. Sigue golpeando.", "defn": "Cualquier defensor puede estar aquí, pero estos son los más comunes.\n\n**__Black Cat y Spider Punk son imposibles de Intercept, a menos que lleves un counter de Evade como Okoye, Bong y otros.__**", "attn": "Elige campeones que hagan Intercept fácil, o uno con tanto daño que puedas jugar normal sin hacer Intercept."}, "24": {"desc": "Durante los primeros 20 segundos nadie puede usar buffs ni debuffs, así que es una pelea a puños pura.\n\nHay dos cosas que te favorecen: cada Critical Hit suma 2 a tu medidor de combo, y si repites dos veces seguidas el mismo ataque que termina el combo, el segundo es un Critical Hit garantizado.", "attn": "Usa campeones que no dependan de buffs ni debuffs para su daño, o con debuffs pasivos como Onslaught."}, "25": {"desc": "Thorns: cuando golpeas al defensor con un ataque de contacto hay un 60% de probabilidad de que te devuelva el 10% de su Ataque como daño Physical. No es gran cosa, solo un poco de daño de rebote.\n\nBe Like Water: cada vez que el defensor recibe un debuff que no hace daño gana Unblockable durante 8 segundos. Así que no tires debuffs sin daño por todos lados a menos que puedas aguantar sus ataques Unblockable.", "defn": "Defensores tanque, y defensores que naturalmente te devuelven algo de daño.", "attn": "Cassandra Nova, Nova, Onslaught, Strange, Prowler, Shuri y Pavitr golpean con ataques sin contacto, así que Thorns no se activa. Bleed y Poison también están bien, son debuffs que hacen daño y no activan el Unblockable."}, "26": {"desc": "No repitas el mismo ataque básico dos veces seguidas (Ligero, Ligero o Medio, Medio), si no el defensor recibe Intensify: sus buffs son 25% más fuertes durante 8 segundos.\n\nCada 18 segundos además gana 25% de su poder durante 10 segundos, así que espera Especiales seguido y prepárate para bloquear o esquivar.\n\nEs inmune a la reducción de Ability Accuracy, así que no cuentes con eso para frenar sus buffs.", "defn": "Galan es el más común aquí. Usa a Nico contra él. Los otros son los molestos.", "attn": "Los Mystics normalmente son los mejores. Pero el nodo no es difícil: si el defensor es Science y un Mystic no es buena opción, lleva un buen counter y concéntrate."}, "27": {"desc": "Igual que el Nodo 9 (Hazard Shift), pero esta vez el defensor gana poder más rápido hasta llegar a dos barras de poder, y los debuffs son Poison y Coldsnap. Usa un campeón inmune a los dos, o a uno de ellos.", "attn": "Nico necesita el prefight correcto para ser inmune a Poison. Warlock es inmune a los dos."}, "28": {"desc": "La parte de regeneración funciona igual que en el Nodo 19. Cada vez que el defensor se regenera acumula una carga oculta, y con 10 cargas gana Unblockable durante 5 segundos. Heal Block detiene la acumulación.\n\nCada vez que activas un buff, se le hace Nullify de inmediato y el defensor recibe un buff de Regeneration. Así que no dependas de buffs, por cierto, Dex cuenta como buff.\n\nCada 15 segundos, el defensor gana 25% de Armor Up durante 6 segundos.\n\nEn este nodo la curación no se puede revertir, solo bloquear. Los campeones con Heal Reversal no van a funcionar.", "defn": "Lizard se vuelve inmune a Heal Block cuando tiene el buff que le da este nodo, y es inmune a la regeneración revertida por naturaleza. Lady Deathstrike es inmune por naturaleza a Heal Block y a la regeneración revertida.", "attn": "Los campeones con Heal Block solo funcionan después de que revises que el defensor no sea inmune a Heal Block. Evita a los campeones con Heal Reversal, y aléjate de cualquier campeón con muchos buffs."}, "29": {"desc": "Cada 2.2 segundos que te quedas cerca del defensor recibes un buff de Placebo. No hace nada por sí solo, pero igual es un buff.\n\nCada buff que recibes le da al defensor una carga de Overclock (máx. 10), y cada carga hace que sus golpes hagan +15% de daño Energy. Cuando usa un Especial, todas las cargas se convierten en Shocks, cada uno con 25% de su Ataque como daño Energy durante 10 segundos. Además, cada vez que a uno de tus buffs le hacen Nullify o se acaba, el defensor gana 5% de su poder máximo.\n\nEn resumen: mientras más buffs tengas, más peligroso se pone. El Stun también es más débil contra él (20% más corto cada vez).", "attn": "No cuentes con el Stun aquí."}, "30": {"desc": "No repitas el mismo ataque básico dos veces seguidas (Ligero, Ligero o Medio, Medio), si no recibes un debuff de Disintegration que duele.\n\nSi a un debuff tuyo le hacen Purify o Cleanse, recibes una ráfaga de daño igual al 30% del Ataque del defensor. Así que nada de trucos de Purify aquí.\n\nEl defensor no puede perder más del 1% de su salud por un solo golpe mientras lo golpean o está bloqueando. Los golpes grandes y los Especiales casi se desperdician, necesitas muchos golpes pequeños.", "attn": "Los campeones con daño burst (el daño rojo) como Silk, Black Tarantula, Overseer, Wave, Guillotine 2099 y Absorbing Man son muy útiles. También los campeones con Reverb como Gentle, Solvarch y Northstar, y los campeones con Power Sting como Ham y Spider Woman. Serpent también funciona bien en este nodo. Aléjate de los campeones que hacen Purify o Cleanse."}, "31": {"desc": "Tienes Heal Block permanente, y el defensor tiene 100% más de Ability Accuracy en sus habilidades defensivas.\n\nSi tienes 3 o más debuffs, el defensor se vuelve Unblockable hasta que no tengas ninguno. Cada vez que haces Purify de un debuff también queda Unblockable durante 7 segundos.\n\nCada 12 segundos recibes un Power Sting (70% de su Ataque como daño), así que no lances un Especial mientras lo tengas. Llegar a un combo de 10 golpes lo quita.", "defn": "Cualquier defensor con muchos debuffs.", "attn": "Los campeones que hacen Purify son los mejores, pero ojo con el Unblockable. Bong, Black Tarantula y Kingpin lo manejan bien. Silk es útil por su Evade y su mucho daño. Aléjate de los campeones que dependen de lanzar muchos Especiales, porque el Power Sting te va a pegar duro, y de los que tardan mucho en arrancar."}, "32": {"desc": "Igual que el Nodo 23: el defensor tiene Protection que reduce tu daño un 60%. Haz Intercept para quitarle la Protection y ganar +40% de Ataque durante 12 segundos. Cuando termina ese Fury la Protection vuelve y a todos los debuffs del defensor se les hace Purify.\n\nAdemás, cada vez que el defensor hace dash hacia adelante hace Purify de todos sus debuffs y no se le pueden poner debuffs hasta que termine el dash. Así que no cuentes con debuffs durante su dash.", "defn": "Cualquier defensor puede estar aquí, pero estos son los más comunes.\n\n**__Black Cat y Spider Punk son imposibles de Intercept, a menos que lleves un counter de Evade como Okoye, Bong y otros.__**", "attn": "Elige campeones que hagan Intercept fácil, o uno con tanto daño que puedas jugar normal sin hacer Intercept."}, "33": {"desc": "No repitas el mismo ataque básico dos veces seguidas, si no el defensor recibe +50% de Prowess durante 10 segundos, y con eso 40% de Block Penetration durante 5 segundos. Mezcla tus ataques.\n\nCada 7 segundos al primer debuff que le pongas se le hace Purify de inmediato, y el defensor gana 50% de una barra de poder cada vez. Así que no dependas de debuffs.", "defn": "Cualquier defensor puede estar aquí, pero normalmente son Mutants.", "attn": "Bloquear es más débil mientras tiene Block Penetration, así que esquiva más.\n\nLos campeones Tech con debuff de Cowardice son muy útiles, sobre todo contra Mutants, como Iron Heart, Jack O'Lantern y Nimrod. __Iron Man no tiene debuff de Cowardice, pero cuando usa un Especial quita el Prowess, causa daño burst con cada Prowess, y bloquea el Unblockable de los campeones Mutant solamente.__"}, "34": {"desc": "Cada vez que el defensor hace Purify o Cleanse de un debuff recibe dos cosas: una carga de Unblockable (con 3 cargas queda Unblockable durante 8 segundos), y un +5% permanente de velocidad de ganancia de poder (hasta 20 veces). Así que cada debuff que quita lo hace más fuerte.", "defn": "Cualquier defensor puede estar aquí, sobre todo campeones que hacen Purify.", "attn": "Termínalo antes de que escale. Los Mutants con Neuroshock o daño burst como Onslaught, Jean Grey, Cassandra Nova y Gentle son geniales en este nodo."}, "35": {"desc": "El defensor tiene Protection permanente que reduce tu daño un 75%. Derríbalo para quitarle la Protection durante 15 segundos.\n\nSi le haces Stun, el 100% del daño que le hagas mientras está aturdido te regresa a ti. Así que no lo golpees mientras está aturdido.\n\nCon cada buff que gana el defensor, su daño sube.", "defn": "Sobre todo campeones Cosmic, porque tienen muchos buffs.", "attn": "No le hagas Stun. Viv Vision es genial aquí porque se vuelve intangible cuando haces Parry, así que no necesitas hacer Stun. Los campeones tanque funcionan bien si dependes del Parry, por su gran salud."}, "36": {"desc": "La misma idea de Hazard Shift que el Nodo 9, pero los debuffs son Incinerate y Bleed. Cada golpe que le das tiene 40% de probabilidad de ponerte Incinerate, y cada 12 segundos cambia a Bleed. Usa un campeón inmune a los dos, o a uno de ellos.\n\nAdemás, si le haces Stun, el 100% del daño que recibe mientras está aturdido te regresa. Así que no le hagas Stun.", "attn": "No le hagas Stun."}, "37": {"desc": "Cada 12 segundos quedas con Root durante 5 segundos. Si estás lejos del defensor cuando se activa, el que queda con Root es el defensor. El temporizador se pausa durante los Especiales y solo reinicia cuando termina el Root.\n\nQuedarte cerca de él lo hace regenerarse (0.5% de su salud máxima por segundo, se acumula). Cada 2 segundos lejos de él quita una acumulación. Así que golpea y retrocede.", "attn": "Estar lejos en el momento justo hace que el defensor sea el que queda con Root. Los Mutants con Neuroshock o daño burst como Onslaught, Jean Grey, Cassandra Nova y Gentle son geniales en este nodo."}, "38": {"desc": "El defensor tiene Protection (-60% a tu daño). Derríbalo para quitarle la Protection y ganar +40% de Ataque durante 12 segundos. Cuando termina el Fury la Protection vuelve y a sus debuffs se les hace Purify.\n\nSi lo derribas con un Pesado o un Especial, no se le pueden poner debuffs durante 6 segundos. Eso significa que no le puedes hacer Stun durante ese tiempo.", "attn": "No dependas de debuffs justo después de derribarlo. Los Mutants con Neuroshock o daño burst como Onslaught, Jean Grey, Cassandra Nova y Gentle son geniales en este nodo."}, "39": {"desc": "Quien tenga más buffs únicos gana 12% de una barra de poder cada segundo. Así que o tienes más buffs que el defensor, o le haces Nullify a sus buffs.\n\nDespués de cada uno de sus Especiales recibe Stun Immunity (6 segundos más 2 por cada buff único), 25% de probabilidad de Evade y Unstoppable durante 3 segundos. Así que no cuentes con el Stun justo después de su Especial.", "defn": "Sobre todo campeones con muchos buffs."}, "40": {"desc": "No repitas el mismo ataque básico dos veces seguidas, porque al segundo le hacen Evade el 100%. Mezcla tus ataques.\n\nEl defensor no puede ser aturdido mientras hace dash hacia adelante ni durante el primer ataque Ligero o Medio de su combo. Un Well-Timed Block desactiva esto durante 8 segundos. Pero cada Well-Timed Block también te da una carga de Fuse. Con 3 cargas recibes Soul Barb, que te hace daño cada segundo durante 20 segundos, según la cantidad de buffs que tenga el defensor. Cada 5 golpes de tu combo quitan una carga.\n\nAsí que bloquea perfecto, pero no lo hagas tres veces sin golpear de vuelta.", "defn": "Defensores tanque, campeones con Evade natural, campeones con Auto Block, o campeones que hacen Reverse Controls.", "attn": "Usa campeones con debuff de Slow, Coldsnap o Panic, o campeones con Pursuit o True Strike. Venom solo evita la distancia contra campeones con la etiqueta #Spider-Verse. Strange y Nico son útiles porque ganan poder rápido, así que lanzas un Especial cada poco."}, "41": {"desc": "Cada 6 segundos quedas con Root durante 4 segundos. Conectar un golpe reinicia el temporizador, así que sigue atacando.\n\nCada vez que bloqueas pierdes 4% de Block Proficiency, y cada 10 bloqueos su siguiente ataque es Unblockable. Así que bloquea lo menos posible y esquiva.\n\nEl defensor gana poder 60% más rápido mientras está por debajo de 2 barras, y 80% más lento cuando está por encima de 2 barras.", "attn": "Los campeones tanque con mucha salud como Serpent y Sentinel funcionan bien. También los que ganan poder rápido como Nico, Strange y Karolina, y los campeones con Power Drain como Warlock. Prowler funciona bien aquí porque drena todo el poder que queda después de que el defensor usa un Especial. Los campeones que roban poder como Spiral, Agatha y Shathra también son buenos."}, "42": {"desc": "El defensor tiene 100% más de Ability Accuracy en sus habilidades defensivas. Si tienes 3 o más debuffs se vuelve Unblockable hasta que no tengas ninguno, y cada vez que haces Purify de un debuff queda Unblockable durante 7 segundos. Mantén bajos tus debuffs.\n\nCada buff que activas recibe Nullify de inmediato y el defensor gana 75% de una barra de poder (una vez cada 7 segundos). Así que no dependas de buffs.\n\nCada vez que gana una barra de poder recibes un Power Sting durante 6 segundos. Si usas un Especial mientras lo tienes, recibes 50% de su Ataque como daño.", "defn": "Cualquier defensor con muchos debuffs.", "attn": "Los campeones que hacen Purify son los mejores, pero ojo con el Unblockable. Bong, Black Tarantula y Kingpin lo manejan bien. Silk es útil por su Evade y su mucho daño. Aléjate de los campeones que dependen de lanzar muchos Especiales, porque el Power Sting te va a pegar duro, de los que tardan mucho en arrancar, y de los campeones con muchos buffs."}, "43": {"desc": "Otra vez Hazard Shift (ver Nodo 9), ahora con Incinerate y Shock. 40% de probabilidad en cada golpe, y cada 12 segundos cambia a Shock.\n\nEmpiezas la pelea con Power Lock, Heal Block y Fate Seal durante 8 segundos. Si le pones alguno de estos al defensor, se comparte de vuelta contigo durante 4 segundos. Así que evita esos debuffs.\n\nCada 2 segundos gana una acumulación de Prowess. Golpearlo reinicia el temporizador y quita una acumulación, así que sigue golpeando."}, "44": {"desc": "Otra vez Hazard Shift (ver Nodo 9): Poison, y cada 12 segundos cambia a Rupture. Usa un campeón inmune a los dos, o a uno de ellos.\n\nEl Stun también es más débil contra él (20% más corto cada vez), así que no cuentes con el Stun."}, "45": {"desc": "Otra vez Hazard Shift (ver Nodo 9): Coldsnap, y cada 12 segundos cambia a Bleed. Usa un campeón inmune a los dos, o a uno de ellos.\n\nCada 7 segundos al primer debuff que le pongas se le hace Purify de inmediato, y gana 50% de una barra de poder cada vez. Así que no dependas de debuffs."}, "46": {"desc": "Cada vez que el defensor llena una barra de poder se vuelve 5% más fuerte (Ataque, Armor, Critical Rating, Critical Resistance, Block Penetration, velocidad de ganancia de poder y Ability Accuracy) por el resto de la pelea. Mientras más larga la pelea, más difícil se pone.\n\nSu Especial 2 hace 20% más de daño y su primer golpe es Unblockable (melee o proyectil instantáneo). Los efectos de Power Gain sobre él son 50% más fuertes.\n\nCada vez que bloqueas, recibe un pasivo de Inexorable durante 4 segundos.", "defn": "Defensores tanque.", "attn": "Termínalo rápido antes de que escale."}, "47": {"desc": "Un tanque: +300% de salud, así que espera una pelea larga.\n\nCada vez que se acaba un buff del defensor tienes 4 segundos para pegarle con un Pesado o un Especial. Si lo haces, el defensor recibe Falter (100% de Miss) durante 4 segundos. Si no, el que recibe Falter eres tú.\n\nCada 12 segundos gana Unstoppable durante 4 segundos. Si estás lejos cuando se activa, el que recibe Unstoppable eres tú.", "attn": "El nodo no es difícil. Solo ten cuidado con el Falter."}, "48": {"desc": "Safeguard: el defensor no puede perder más del 1% de su salud por un solo golpe mientras lo golpean o está bloqueando. Así que necesitas muchos golpes pequeños, los golpes grandes se desperdician.\n\nStun Shield: no se le puede hacer Stun, y si lo intentas, TÚ recibes Stun durante 3 segundos. Ponle Bleed o Shock para apagar el escudo durante 8 segundos (además ganas +40% de Ataque en ese tiempo).\n\nBane: quien conecte el primer golpe le pone una Curse al otro campeón (0.5% de su salud actual por segundo). La Curse salta al otro campeón cada vez que el que la tiene golpea, o después de 10 segundos. Pega primero y sigue pasándola.", "attn": "No le hagas Stun. Revisa que el defensor no sea inmune a Bleed y Shock, por ejemplo Terrax es inmune a los dos. Intenta conectar el primer golpe. Gentle es genial aquí: es inmune a Stun Reflection, así que si haces Parry sin querer no te aturdes. Si tu último golpe del combo es un ataque Ligero él pone un debuff de Rupture, que es útil. Su daño es burst, así que el límite de 1% de Safeguard casi no lo afecta."}, "49": {"desc": "Stun Shield: no se le puede hacer Stun, y si lo intentas, TÚ recibes Stun durante 3 segundos. Ponle Poison o Incinerate para apagar el escudo durante 8 segundos (además ganas +40% de Ataque en ese tiempo).\n\nPolka Dot Power: no ganas poder al golpear ni al recibir golpes. Solo ganas 8.3% de una barra por segundo mientras el defensor tiene un efecto de daño encima, así que mantén uno siempre.\n\nBrute Force: si pasas 6 segundos sin conectar un golpe empiezas a perder salud (100% en 30 segundos). Cualquier golpe lo quita. El daño depende de las Class Relationships.", "attn": "No le hagas Stun, y no pases más de 6 segundos sin conectar un golpe. Revisa que el defensor no sea inmune a Poison e Incinerate.\n\n**__Muy importante: los debuffs pasivos no cuentan como debuff aquí, así que no vas a ganar nada de poder. Onslaught no funciona en este nodo, pero Jean Grey sí.__** Gentle es genial aquí: es inmune a Stun Reflection, así que si haces Parry sin querer no te aturdes. Si tu último golpe del combo es un ataque Ligero él pone un debuff de Rupture, que es útil. Su daño es burst, así que el límite de 1% de Safeguard casi no lo afecta."}, "50": {"desc": "El jefe: +700% de salud, así que espera una pelea muy larga.\n\nCada 8 segundos rota entre inmunidad a Stun, Slow y Heal Block, así que revisa cuál está activa antes de usarlos.\n\nCada vez que lo golpean gana +4% de Resistance, permanente. El tipo cambia cada 8 segundos, empezando por Physical, luego Energy, y solo se puede ganar uno por ciclo.", "defn": "Cualquier defensor tanque difícil.", "attn": "Onslaught es uno de los mejores atacantes aquí, incluso con desventaja de Class, porque su Degeneration es muy fuerte."}}, "phr": {"Any defender can be here": "Cualquier defensor puede estar aquí", "Any defender, it does not matter much": "Cualquier defensor, no importa mucho", "Mostly Mutants": "Sobre todo Mutants", "Mostly Cosmic or Mutants": "Sobre todo Cosmic o Mutants", "Cosmic champions": "Campeones Cosmic", "Most Science champions": "La mayoría de los campeones Science", "Any Cosmic champion": "Cualquier campeón Cosmic", "Any Science champion": "Cualquier campeón Science", "Any champion that is strong against the defender": "Cualquier campeón fuerte contra el defensor", "Any champion that counters the defender": "Cualquier campeón que sea counter del defensor", "Any champion that works against the defender": "Cualquier campeón que funcione contra el defensor", "Any champion that breaks Armor": "Cualquier campeón que rompa Armor", "Any high damage attacker": "Cualquier atacante de mucho daño", "Any very high damage champion": "Cualquier campeón de muchísimo daño", "Skill champions that Purify Debuffs": "Campeones Skill que hacen Purify de debuffs", "Champions immune to the defender's Debuffs": "Campeones inmunes a los debuffs del defensor", "Damage over Time champions": "Campeones de Damage over Time", "Champions that Purify": "Campeones que hacen Purify", "Other champions that Purify": "Otros campeones que hacen Purify", "Champions immune to Rupture or Bleed": "Campeones inmunes a Rupture o Bleed", "Champions immune to Incinerate or Bleed": "Campeones inmunes a Incinerate o Bleed", "Champions immune to Incinerate or Shock": "Campeones inmunes a Incinerate o Shock", "Champions immune to Poison or Rupture": "Campeones inmunes a Poison o Rupture", "Champions immune to Coldsnap or Bleed": "Campeones inmunes a Coldsnap o Bleed", "Champions immune to Stun": "Campeones inmunes a Stun", "Champions immune to Shock": "Campeones inmunes a Shock", "Heal Block champions": "Campeones con Heal Block", "Cosmic champions with Power Gain": "Campeones Cosmic con Power Gain", "Non-Energy damage dealers": "Campeones de daño que no sea Energy", "Champions that reverse regeneration": "Campeones que revierten la regeneración", "Champions with Physical Resistance": "Campeones con Physical Resistance", "Champions with Energy Resistance": "Campeones con Energy Resistance", "A strong counter to the defender": "Un counter fuerte del defensor", "Champions that don't depend on buffs": "Campeones que no dependan de buffs", "Champions that don't depend on debuffs": "Campeones que no dependan de debuffs", "Champions with fast, many-hit combos": "Campeones con combos rápidos de muchos golpes", "Burst damage champions": "Campeones de daño Burst", "Champions that Knock Down easily": "Campeones que derriban fácil", "Champions that Nullify buffs": "Campeones que hacen Nullify de buffs", "Very high damage champions": "Campeones de muchísimo daño", "Tanky champions": "Campeones tanque", "Fast high damage champions": "Campeones rápidos de mucho daño", "Fast aggressive champions": "Campeones rápidos y agresivos", "Champions that rely on buffs, not debuffs": "Campeones que dependen de buffs, no de debuffs", "Champions whose debuffs are passive": "Campeones cuyos debuffs son pasivos", "Champions with many unique buffs": "Campeones con muchos buffs únicos", "Champions that keep its power low (Power Drain, Power Lock or Power Steal)": "Campeones que le mantienen el poder bajo (Power Drain, Power Lock o Power Steal)", "Nullify champions": "Campeones con Nullify", "Use any champion you think fits the defender": "Usa cualquier campeón que creas que le queda bien al defensor", "Champions with a Damage over Time debuff, especially Bleed and Shock": "Campeones con debuff de Damage over Time, sobre todo Bleed y Shock", "Champions with a Damage over Time debuff, especially Poison and Incinerate": "Campeones con debuff de Damage over Time, sobre todo Poison e Incinerate", "Tech champions with a Cowardice debuff": "Campeones Tech con debuff de Cowardice"}, "globals": [{"title": "Buff Global de Defensores", "who": "Solo los defensores que llevan esta insignia redonda reciben el buff:", "intro": "Todos los defensores con la etiqueta #Genesis2026 ganan un buff pasivo de Unblockable. El buff crece con las barras de poder que gasta el defensor.", "stats": [["+500", "Ataque"], ["+5000", "Salud"]]}, {"title": "Buff Global de Atacantes", "who": "Solo los atacantes que llevan esta insignia de escudo reciben el buff (en el ejemplo, Onslaught, Jean Grey y Dragon Man la tienen; Dust y Yelena no):", "intro": "Si un atacante #Coda2026 hace Punish al Ataque Especial del defensor, le quita todos los efectos de Unblockable al defensor y gana un pas     const g = lang === "es" ? { ...g0, ...ES.globals[i] } : g0;
    const badge = el("div", { class: "gbadge", title: g.kind === "def" ? "Defender badge" : "Attacker badge" });
    if (g.kind === "def") badge.appendChild(el("img", { src: BADGE_DEF, alt: "Defender badge" }));
    else badge.innerHTML = SHIELD_SVG;
    const steps = [];
    if (g.scale) {
      g.scale.forEach(([a, b]) => steps.push(el("span", { class: "step" }, a + T("gains"), el("b", { text: b }))));
      if (g.scaleMore) steps.push(el("span", { class: "more", text: (lang === "es" ? T("more") : g.scaleMore) + "…" }));
    }
    return el("div", { class: "global" },
      badge,
      el("div", {},
        el("h2", { id: "gTitle" + i }, g.title, el("small", { text: g.tag })),
        el("p", { class: "who", text: g.who }),
        el("p", { class: "intro" }, tagged(g.intro)),
        el("div", { class: "gbody" },
          ...(steps.length ? [el("div", { class: "scale" }, steps)] : []),
          el("div", { class: "gstats" }, g.stats.map(([v, l]) => el("div", { class: "gstat" + (g.scale ? "" : " wide") }, el("b", { text: v }), el("span", { text: l }))))
        )
      )
    );
  }));
}
function renderBgSwitch() {
  $("#bgSwitch").replaceChildren(...BGS.map((b, i) => el("button", { type: "button", "aria-pressed": String(i === state.bg), text: b.label, onclick: () => { state.bg = i; state.player = null; state.path = null; renderAll(); } })));
}
function renderStats() {
  const bg = BGS[state.bg];
  $("#stats").replaceChildren(
    el("span", {}, T("statPlayers"), el("b", { text: bg.players.length })),
    el("span", {}, T("statNodes"), el("b", { text: Array.from({ length: 50 }, (_, i) => i + 1).filter(explained).length + " / 50" }))
  );
}
function renderPlayers() {
  const bg = BGS[state.bg];
  $("#players").replaceChildren(...bg.players.map((p, i) => {
    const sorted = [...p.nodes].sort((a, b) => a - b);
    return el("button", { type: "button", class: "player" + (p.nodes.includes(50) ? " has50" : ""), "aria-pressed": String(state.player === i), onclick: () => { state.player = state.player === i ? null : i; state.path = null; applyFocus(); renderPlayers(); renderPaths(); } },
      el("span", { class: "nm" }, el("span", { text: p.name }), el("small", { text: sorted.length + " " + T("nodesWord") })),
      el("span", { class: "chips" }, sorted.map(n => el("span", { class: "chip" + (n === 50 ? " c50" : ""), text: n })))
    );
  }));
}
function renderPaths() {
  $("#paths").replaceChildren(...PATH_COLORS.map((c, i) => el("button", { type: "button", class: "pathbtn", "aria-pressed": String(state.path === i + 1), onclick: () => { state.path = state.path === i + 1 ? null : i + 1; state.player = null; applyFocus(); renderPlayers(); renderPaths(); } },
    el("i", { style: "background:" + c }), el("span", {}, T("path") + (i + 1), el("small", { text: PATH_THEMES[i] })))));
}
function currentFocus() {
  const bg = BGS[state.bg];
  if (state.player !== null) return bg.players[state.player].nodes;
  if (state.path !== null) return pathNodes(state.path);
  return null;
}
function applyFocus() {
  const set = currentFocus();
  map.classList.toggle("focus", !!set);
  for (let n = 1; n <= 50; n++) nodeEls[n].classList.toggle("on", !!set && set.includes(n));
  routeEl.setAttribute("points", set ? [...set].sort((a, b) => a - b).map(n => pos[n].join(",")).join(" ") : "");
}
function applyMarks() {
  for (let n = 1; n <= 50; n++) nodeEls[n].querySelector(".pip").setAttribute("visibility", explained(n) ? "visible" : "hidden");
}
function renderAll() { renderBgSwitch(); renderStats(); renderPlayers(); renderPaths(); applyMarks(); applyFocus(); }

/* --- details sheet --- */
function section(title, ...kids) { return el("div", { class: "sec" }, el("h3", { text: title }), ...kids); }
function rich(s) {
  const out = [], re = /\*\*(.+?)\*\*|__(.+?)__/g; let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push(s.slice(last, m.index));
    out.push(m[1] !== undefined ? el("strong", {}, rich(m[1])) : el("u", {}, rich(m[2])));
    last = re.lastIndex;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}
function nameList(value) {
  const parts = (Array.isArray(value) ? value : String(value).split(/\s+[-|–]\s+/)).map(s => s.trim()).filter(Boolean);
  const p = el("p", { class: "names" });
  parts.forEach((name, i) => { if (i) p.append(el("span", { class: "sep", text: "-" })); p.append(name); });
  return p;
}

let openedNode = null;
function openNode(n) {
  lastFocus = nodeEls[n];
  const bg = BGS[state.bg], info = nodeInfo(n), owner = bg.players.find(p => p.nodes.includes(n));
  const st = nodeStyle(n);
  const badge = $("#sBadge");
  badge.textContent = n; badge.style.background = st.fill; badge.style.color = st.text;
  openedNode = n;
  $("#sheetTitle").textContent = n === 50 ? T("boss") : T("node") + n;
  $("#sOwner").textContent = [bg.label, pathName(n), owner ? owner.name : T("unassigned")].join(" · ");
  const L = lang === "es" ? (ES.nodes[n] || {}) : {};

  const body = [];
  if (!info) {
    body.push(el("div", { class: "empty", text: T("empty") }));
  } else {
    if (info.desc) body.push(section(T("desc"), el("div", { class: "card" }, info.draft ? el("span", { class: "draft", text: T("draft") }) : "", el("p", { class: "desc" }, rich(L.desc || info.desc)))));
    if (info.defenders) {
      const card = el("div", { class: "card" }, nameList(locNames(info.defenders)));
      if (info.defendersNote) card.append(el("p", { class: "note" }, rich(L.defn || info.defendersNote)));
      body.push(section(T("defenders"), card));
    }
    if (info.attackers) {
      const card = el("div", { class: "card" }, nameList(locNames(info.attackers)));
      if (info.attackersNote) card.append(el("p", { class: "note" }, rich(L.attn || info.attackersNote)));
      body.push(section(T("attackers"), card));
    }
  }
  $("#sBody").replaceChildren(...body);
  $("#backdrop").hidden = false;
  document.body.style.overflow = "hidden";
  $("#sClose").focus();
}
function closeSheet() {
  $("#backdrop").hidden = true;
  document.body.style.overflow = "";
  if (lastFocus) { try { lastFocus.focus(); } catch (e) {} }
}
$("#sClose").addEventListener("click", closeSheet);
$("#backdrop").addEventListener("click", e => { if (e.target.id === "backdrop") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#backdrop").hidden) closeSheet(); });

/* --- init --- */
const nameEl = $("#clanName");
const words = CLAN.name.split(" ");
nameEl.append(words.slice(0, -1).join(" ") + " ", el("span", { text: words[words.length - 1] }));
function applyStatic() {
  document.documentElement.lang = lang;
  $("#clanTagline").textContent = lang === "es" ? UI.es.tagline : CLAN.tagline;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = T(e.dataset.i18n); });
}
function renderLang() {
  $("#langSwitch").replaceChildren(...["en", "es"].map(l => el("button", { type: "button", "aria-pressed": String(lang === l), text: l.toUpperCase(), "aria-label": l === "en" ? "English" : "Español", onclick: () => setLang(l) })));
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  applyStatic(); renderLang(); renderGlobal(); renderAll();
  if (!$("#backdrop").hidden && openedNode) openNode(openedNode);
}
$("#clanTagline").textContent = CLAN.tagline;
document.title = CLAN.name + " War Map";
applyStatic();
renderLang();
renderGlobal();
renderAll();
</script>
</body>
</html>
